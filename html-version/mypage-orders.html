<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 주문 내역" />
    <title>My Orders - 슬런치 팩토리</title>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
    <style>
      /* === DESIGN SYSTEM === */
      :root {
        --header-h: 64px;
        --cream: #FDFBF7;
        --lime: #DCFD4A;
        --black: #000000;
        --gray: #6B6B6B;
        --gray-light: #9A9A9A;
        --charcoal: #333;
        --warm-gray: #888;
        --muted: #999;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; font-weight: 400 !important; }
      body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--cream);
        min-height: 100vh;
        color: var(--black);
      }

      /* === HEADER === */
      .header {
        height: var(--header-h);
        background: var(--lime);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 16px;
        max-width: 1440px;
        margin: 0 auto;
        position: relative;
      }
      .header-left button, .header-left a {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        color: var(--black);
      }
      .header-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .header-center img { height: 36px; display: block; }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-right a {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 14px;
        color: var(--black);
        text-decoration: none;
      }
      .header-profile {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #E5E5E5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* === MAIN CONTENT === */
      main {
        margin-top: var(--header-h);
        padding: 24px 16px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }

      .page-title {
        font-size: 24px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #000;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
      }
      .empty-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .empty-text {
        font-size: 15px;
        color: var(--warm-gray);
        margin-bottom: 24px;
      }
      .empty-btn {
        display: inline-block;
        padding: 12px 24px;
        background: #000;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
      .empty-btn:hover { background: #333; }

      .order-card {
        border: 1px solid #eee;
        margin-bottom: 16px;
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        background: #f9f9f9;
        border-bottom: 1px solid #eee;
      }
      .order-date {
        font-size: 14px;
        color: var(--charcoal);
      }
      .order-status {
        font-size: 13px;
        padding: 4px 12px;
        background: var(--lime);
      }
      .order-content { padding: 16px; }
      .order-item {
        display: flex;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
      }
      .order-item:last-child { border-bottom: none; }
      .order-img {
        width: 60px;
        height: 60px;
        background: #E8E4DF;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .order-info { flex: 1; }
      .order-name {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .order-qty {
        font-size: 13px;
        color: var(--warm-gray);
      }
      .order-price { font-size: 14px; }
      .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        border-top: 1px solid #eee;
      }
      .order-total-label {
        font-size: 14px;
        color: var(--warm-gray);
      }
      .order-total { font-size: 18px; }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a href="mypage.html" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
        </div>
        <a href="index.html" class="header-center">
          <img src="../public/common/logo.png" alt="SLUNCH FACTORY">
        </a>
        <div class="header-right">
          <a href="cart.html" aria-label="장바구니">(0)</a>
          <a href="mypage.html" aria-label="마이페이지">
            <div class="header-profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </a>
        </div>
      </div>
    </header>

    <main>
      <h1 class="page-title">주문 내역</h1>

      <!-- Empty State -->
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <p class="empty-text">아직 주문 내역이 없습니다.</p>
        <a href="store.html" class="empty-btn">쇼핑하러 가기</a>
      </div>

  </body>
