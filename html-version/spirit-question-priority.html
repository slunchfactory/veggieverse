<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 나의 슬로우 스피릿 찾기" />
    <title>Spirit Finder - 질문 4 - 슬런치 팩토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../index.css">
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <style>
      :root { --lime: #DCFD4A; --brown: #8C451D; }
      body { background: #B2B2B2; min-height: 100vh; margin: 0; padding: 0; }
      .question-container { min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .content-wrapper { width: 100%; max-width: 1000px; padding: 24px 8px; }
      .question-area { position: sticky; top: 16px; z-index: 10; background: #B2B2B2; padding: 16px 0; margin-bottom: 40px; }
      .question-header { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
      .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--brown); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--lime); }
      .back-btn:focus { outline: none; }
      .question-text { font-size: 16px; font-weight: 400; color: #44403c; text-align: center; padding: 0 40px; }
      @media (min-width: 768px) { .question-text { font-size: 20px; } }
      .progress-line { width: 100%; height: 1px; background: #000; margin-top: 16px; }
      .progress-fill { height: 4px; background: #000; transition: width 0.3s ease; margin-top: 0; }
      .mobile-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 0 12px 16px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; width: calc(100% + 32px); margin-left: -16px; cursor: grab; }
      .mobile-scroll:active { cursor: grabbing; }
      .mobile-scroll::-webkit-scrollbar { display: none; }
      .mobile-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      .desktop-grid { display: none; flex-direction: column; align-items: center; gap: 24px; }
      .desktop-row { display: flex; justify-content: center; gap: 24px; }
      @media (min-width: 768px) { .mobile-scroll { display: none !important; } .desktop-grid { display: flex !important; } }
      .card-wrapper { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; scroll-snap-align: center; cursor: pointer; }
      .tarot-card { width: 130px; height: 208px; border-radius: 12px; overflow: hidden; background: #E5E5E5; transition: all 0.3s ease; border: 2px solid transparent; }
      @media (min-width: 768px) { .tarot-card { width: 192px; height: 307px; } }
      .tarot-card:hover { transform: translateY(-8px) scale(1.02); }
      .tarot-card.selected { border-color: var(--lime); transform: translateY(-8px) scale(1.02); }
      .tarot-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; -webkit-user-drag: none; }
      .card-label { margin-top: 8px; text-align: center; width: 130px; }
      @media (min-width: 768px) { .card-label { width: 192px; margin-top: 12px; } }
      .card-label .name { font-size: 12px; font-weight: 700; color: #44403c; }
      @media (min-width: 768px) { .card-label .name { font-size: 16px; } }
      .card-label .desc { font-size: 12px; color: #78716c; margin-top: 4px; line-height: 1.3; }
      @media (min-width: 768px) { .card-label .desc { font-size: 14px; opacity: 0; transition: opacity 0.2s; height: 38px; } .card-wrapper:hover .card-label .desc { opacity: 1; } }
    </style>
  </head>
  <body>
    <main class="question-container">
      <div class="content-wrapper">
        <div class="question-area">
          <div class="question-header">
            <button class="back-btn" onclick="goBack()" aria-label="이전">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="question-text">요리에서 가장 중요한 건?</h1>
          </div>
          <div class="progress-line"></div>
          <div class="progress-fill" style="width: 66.6%;"></div>
        </div>

        <!-- 모바일 -->
        <div class="mobile-scroll">
          <div class="card-wrapper" style="margin-left: 12px;" onclick="selectOption('nutrition')">
            <div class="tarot-card"><img src="../public/images/tarot/priority/scale.png" alt="The Scale"></div>
            <div class="card-label"><div class="name">저울</div><div class="desc">탄단지, 영양소 균형이 맞아야 해요</div></div>
          </div>
          <div class="card-wrapper" onclick="selectOption('taste')">
            <div class="tarot-card"><img src="../public/images/tarot/priority/tongue.png" alt="The Tongue"></div>
            <div class="card-label"><div class="name">혀</div><div class="desc">뭐니뭐니해도 맛있어야 해요</div></div>
          </div>
          <div class="card-wrapper" onclick="selectOption('convenience')">
            <div class="tarot-card"><img src="../public/images/tarot/priority/wind.png" alt="The Wind"></div>
            <div class="card-label"><div class="name">바람</div><div class="desc">빠르고 간편하게 먹을 수 있어야 해요</div></div>
          </div>
          <div class="card-wrapper" style="margin-right: 12px;" onclick="selectOption('novelty')">
            <div class="tarot-card"><img src="../public/images/tarot/priority/compass.png" alt="The Compass"></div>
            <div class="card-label"><div class="name">나침반</div><div class="desc">새로운 맛을 시도하고 싶어요</div></div>
          </div>
        </div>

        <!-- 데스크탑 -->
        <div class="desktop-grid">
          <div class="desktop-row">
            <div class="card-wrapper" onclick="selectOption('nutrition')">
              <div class="tarot-card"><img src="../public/images/tarot/priority/scale.png" alt="The Scale"></div>
              <div class="card-label"><div class="name">저울</div><div class="desc">탄단지, 영양소 균형이 맞아야 해요</div></div>
            </div>
            <div class="card-wrapper" onclick="selectOption('taste')">
              <div class="tarot-card"><img src="../public/images/tarot/priority/tongue.png" alt="The Tongue"></div>
              <div class="card-label"><div class="name">혀</div><div class="desc">뭐니뭐니해도 맛있어야 해요</div></div>
            </div>
          </div>
          <div class="desktop-row">
            <div class="card-wrapper" onclick="selectOption('convenience')">
              <div class="tarot-card"><img src="../public/images/tarot/priority/wind.png" alt="The Wind"></div>
              <div class="card-label"><div class="name">바람</div><div class="desc">빠르고 간편하게 먹을 수 있어야 해요</div></div>
            </div>
            <div class="card-wrapper" onclick="selectOption('novelty')">
              <div class="tarot-card"><img src="../public/images/tarot/priority/compass.png" alt="The Compass"></div>
              <div class="card-label"><div class="name">나침반</div><div class="desc">새로운 맛을 시도하고 싶어요</div></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function goBack() { window.location.href = 'spirit-question-mood.html'; }
      function selectOption(value) {
        let answers = JSON.parse(localStorage.getItem('spirit-finder-answers') || '{}');
        answers[4] = value;
        localStorage.setItem('spirit-finder-answers', JSON.stringify(answers));
        setTimeout(() => { window.location.href = 'spirit-question-meaning.html'; }, 300);
      }
    </script>
  </body>
</html>
