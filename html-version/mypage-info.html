<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 정보 - 슬런치 팩토리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="mypage.html" style="padding: 8px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
      <a href="index.html" class="logo">SLUNCH</a>
      <a href="mypage.html" class="cart-link">(0)</a>
    </div>
  </header>

  <main class="main-content">
    <section style="padding: 80px 20px 20px; background: #fff;">
      <div style="max-width: 500px; margin: 0 auto;">
        <h1 style="font-size: 24px; font-weight: 400; margin-bottom: 32px;">회원 정보</h1>
      </div>
    </section>

    <section style="padding: 20px; background: #FDFBF7; min-height: 400px;">
      <div style="max-width: 500px; margin: 0 auto;">
        <div style="background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
          <h2 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">기본 정보</h2>

          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; color: #666; margin-bottom: 8px;">이름</label>
            <input type="text" value="김슬런치" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; color: #666; margin-bottom: 8px;">이메일</label>
            <input type="email" value="slunch@example.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;" disabled>
            <p style="font-size: 12px; color: #999; margin-top: 4px;">이메일은 변경할 수 없습니다</p>
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; color: #666; margin-bottom: 8px;">휴대폰 번호</label>
            <input type="tel" value="010-1234-5678" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
          </div>
        </div>

        <div style="background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
          <h2 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">배송지 정보</h2>

          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; color: #666; margin-bottom: 8px;">기본 배송지</label>
            <div style="padding: 16px; border: 1px solid #ddd; border-radius: 8px;">
              <p style="font-size: 14px; margin-bottom: 4px;">서울특별시 강남구 테헤란로 123</p>
              <p style="font-size: 13px; color: #666;">슬런치 빌딩 5층</p>
            </div>
          </div>

          <button style="width: 100%; padding: 12px; background: #fff; border: 1px solid #ddd; font-size: 14px; border-radius: 8px; cursor: pointer;">배송지 변경</button>
        </div>

        <div style="background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
          <h2 style="font-size: 16px; font-weight: 500; margin-bottom: 20px;">마케팅 수신 동의</h2>

          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 12px;">
            <input type="checkbox" checked style="width: 18px; height: 18px;">
            <span style="font-size: 14px;">이메일 수신 동의</span>
          </label>

          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
            <input type="checkbox" checked style="width: 18px; height: 18px;">
            <span style="font-size: 14px;">SMS 수신 동의</span>
          </label>
        </div>

        <button style="width: 100%; padding: 16px; background: #000; color: #fff; border: none; font-size: 15px; border-radius: 8px; cursor: pointer; margin-bottom: 12px;">저장하기</button>

        <button style="width: 100%; padding: 16px; background: #fff; color: #E53935; border: 1px solid #E53935; font-size: 15px; border-radius: 8px; cursor: pointer;">로그아웃</button>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="footer-container"><div class="footer-logo">SLUNCH FACTORY</div><div class="footer-copyright"><p>&copy; 2024 Slunch Factory.</p></div></div></footer>
  <script src="script.js"></script>
</body>
</html>
