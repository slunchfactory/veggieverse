<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 회원 정보" />
    <title>My Info - 슬런치 팩토리</title>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
    <style>
      /* === DESIGN SYSTEM === */
      :root {
        --header-h: 64px;
        --cream: #FDFBF7;
        --lime: #DCFD4A;
        --black: #000000;
        --gray: #6B6B6B;
        --gray-light: #9A9A9A;
        --charcoal: #333;
        --warm-gray: #888;
        --muted: #999;
        --brown: #8C451D;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; font-weight: 400 !important; }
      body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--cream);
        min-height: 100vh;
        color: var(--black);
      }

      /* === HEADER === */
      .header {
        height: var(--header-h);
        background: var(--lime);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 16px;
        max-width: 1440px;
        margin: 0 auto;
        position: relative;
      }
      .header-left button, .header-left a {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        color: var(--black);
      }
      .header-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .header-center img { height: 36px; display: block; }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-right a {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 14px;
        color: var(--black);
        text-decoration: none;
      }
      .header-profile {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #E5E5E5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* === MAIN CONTENT === */
      main {
        margin-top: var(--header-h);
        padding: 24px 16px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      .page-title {
        font-size: 24px;
        margin-bottom: 32px;
        padding-bottom: 16px;
        border-bottom: 1px solid #000;
      }

      .avatar-section {
        text-align: center;
        margin-bottom: 32px;
      }
      .avatar {
        width: 100px;
        height: 100px;
        background: #E8E4DF;
        border-radius: 50%;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }
      .avatar-change {
        font-size: 14px;
        color: var(--warm-gray);
        cursor: pointer;
        background: none;
        border: none;
      }
      .avatar-change:hover {
        color: #000;
        text-decoration: underline;
      }

      .form-group { margin-bottom: 24px; }
      .form-label {
        display: block;
        font-size: 13px;
        color: var(--warm-gray);
        margin-bottom: 8px;
      }
      .form-input {
        width: 100%;
        padding: 12px;
        border: 1px solid #eee;
        font-size: 15px;
        background: #fff;
        font-family: inherit;
      }
      .form-input:focus {
        outline: none;
        border-color: #000;
      }
      .form-input:disabled {
        background: #f9f9f9;
        color: var(--muted);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .section-title {
        font-size: 16px;
        margin: 32px 0 16px;
        padding-top: 16px;
        border-top: 1px solid #eee;
      }

      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        cursor: pointer;
      }
      .checkbox-item input {
        width: 18px;
        height: 18px;
      }

      .btn-save {
        display: block;
        width: 100%;
        padding: 14px;
        background: var(--brown);
        color: #fff;
        border: none;
        font-size: 15px;
        cursor: pointer;
        margin-top: 32px;
        font-family: inherit;
      }
      .btn-save:hover { opacity: 0.9; }

      .danger-zone {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid #eee;
      }
      .danger-title {
        font-size: 14px;
        color: var(--warm-gray);
        margin-bottom: 12px;
      }
      .danger-btn {
        font-size: 13px;
        color: #999;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
      }
      .danger-btn:hover {
        color: #666;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a href="mypage.html" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
        </div>
        <a href="index.html" class="header-center">
          <img src="../public/common/logo.png" alt="SLUNCH FACTORY">
        </a>
        <div class="header-right">
          <a href="cart.html" aria-label="장바구니">(0)</a>
          <a href="mypage.html" aria-label="마이페이지">
            <div class="header-profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </a>
        </div>
      </div>
    </header>

    <main>
      <h1 class="page-title">회원 정보</h1>

      <div class="avatar-section">
        <div class="avatar">🌱</div>
        <button class="avatar-change">프로필 사진 변경</button>
      </div>

      <form>
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" class="form-input" value="guest@example.com" disabled>
        </div>

        <div class="form-group">
          <label class="form-label">이름</label>
          <input type="text" class="form-input" value="게스트" placeholder="이름을 입력하세요">
        </div>

        <div class="form-group">
          <label class="form-label">연락처</label>
          <input type="tel" class="form-input" placeholder="010-0000-0000">
        </div>

        <h3 class="section-title">식단 정보</h3>

        <div class="form-group">
          <label class="form-label">식단 유형</label>
          <select class="form-input">
            <option value="">선택하세요</option>
            <option value="vegan">비건</option>
            <option value="lacto">락토비건</option>
            <option value="ovo">오보</option>
            <option value="lacto-ovo">락토오보</option>
            <option value="flexi">플렉시테리언</option>
            <option value="pesco">페스코</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">알레르기</label>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox"> 견과류
            </label>
            <label class="checkbox-item">
              <input type="checkbox"> 콩/대두
            </label>
            <label class="checkbox-item">
              <input type="checkbox"> 밀/글루텐
            </label>
            <label class="checkbox-item">
              <input type="checkbox"> 갑각류
            </label>
          </div>
        </div>

        <button type="submit" class="btn-save">저장하기</button>
      </form>

      <div class="danger-zone">
        <p class="danger-title">계정</p>
        <button class="danger-btn">회원 탈퇴</button>
      </div>
    </main>
  </body>
</html>
