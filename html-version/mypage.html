<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 마이페이지" />
    <title>My Page - 슬런치 팩토리</title>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
    <style>
      /* === DESIGN SYSTEM === */
      :root {
        --header-h: 64px;
        --cream: #FDFBF7;
        --lime: #DCFD4A;
        --black: #000000;
        --gray: #6B6B6B;
        --gray-light: #9A9A9A;
        --charcoal: #333;
        --warm-gray: #888;
        --muted: #999;
        --brown: #8C451D;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; font-weight: 400 !important; }
      body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--cream);
        min-height: 100vh;
        color: var(--black);
      }

      /* === HEADER === */
      .header {
        height: var(--header-h);
        background: var(--lime);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 16px;
        max-width: 1440px;
        margin: 0 auto;
        position: relative;
      }
      .header-left button {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
      }
      .header-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .header-center img { height: 36px; display: block; }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-right a {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 14px;
        color: var(--black);
        text-decoration: none;
      }
      .header-profile {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #E5E5E5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* === MAIN CONTENT === */
      main {
        margin-top: var(--header-h);
        padding: 24px 16px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .profile-section {
        text-align: center;
        padding: 32px 0;
        border-bottom: 1px solid #eee;
        margin-bottom: 24px;
      }
      .profile-avatar {
        width: 80px;
        height: 80px;
        background: #E8E4DF;
        border-radius: 50%;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      .profile-name {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .profile-email {
        font-size: 14px;
        color: var(--warm-gray);
        margin-bottom: 16px;
      }
      .profile-edit {
        display: inline-block;
        padding: 8px 20px;
        border: 1px solid #000;
        font-size: 13px;
        text-decoration: none;
        color: #000;
      }
      .profile-edit:hover { background: #f5f5f5; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: #eee;
        margin-bottom: 24px;
      }
      .stat-item {
        background: #fff;
        padding: 20px;
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        margin-bottom: 4px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--warm-gray);
      }

      .menu-list {
        border-top: 1px solid #eee;
      }
      .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid #eee;
        text-decoration: none;
        color: inherit;
      }
      .menu-item:hover {
        background: #f9f9f9;
        margin: 0 -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .menu-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .menu-left svg {
        width: 20px;
        height: 20px;
        color: var(--warm-gray);
      }
      .menu-text { font-size: 15px; }
      .menu-arrow { color: var(--muted); }

      .logout-btn {
        display: block;
        width: 100%;
        padding: 14px;
        text-align: center;
        border: 1px solid #eee;
        color: var(--warm-gray);
        font-size: 14px;
        margin-top: 24px;
        background: #fff;
        cursor: pointer;
      }
      .logout-btn:hover {
        border-color: #000;
        color: #000;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <button aria-label="메뉴 열기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
        <a href="index.html" class="header-center">
          <img src="../public/common/logo.png" alt="SLUNCH FACTORY">
        </a>
        <div class="header-right">
          <a href="cart.html" aria-label="장바구니">(0)</a>
          <a href="mypage.html" aria-label="마이페이지">
            <div class="header-profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </a>
        </div>
      </div>
    </header>

    <main>
      <div class="profile-section">
        <div class="profile-avatar">🌱</div>
        <p class="profile-name">게스트</p>
        <p class="profile-email">guest@example.com</p>
        <a href="mypage-info.html" class="profile-edit">프로필 수정</a>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <p class="stat-value">0</p>
          <p class="stat-label">주문</p>
        </div>
        <div class="stat-item">
          <p class="stat-value">0</p>
          <p class="stat-label">리뷰</p>
        </div>
        <div class="stat-item">
          <p class="stat-value">0P</p>
          <p class="stat-label">적립금</p>
        </div>
      </div>

      <div class="menu-list">
        <a href="mypage-orders.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="menu-text">주문 내역</span>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a href="mypage-bookmarks.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span class="menu-text">북마크</span>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a href="mypage-info.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="menu-text">회원 정보</span>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="menu-text">설정</span>
          </div>
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </div>

      <button class="logout-btn">로그아웃</button>
    </main>
  </body>
</html>
