<!DOCTYPE html>
<html lang="ko">
<head>

<body>
  <header class="header">
    <div class="header-container">
      <a href="store-list.html" style="padding: 8px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
      <a href="index.html" class="logo">SLUNCH</a>
      <a href="mypage.html" class="cart-link">(0)</a>
    </div>
  </header>

  <main class="main-content">
    <section style="padding: 80px 20px 40px; background: #fff;">
      <div style="max-width: 800px; margin: 0 auto;">
        <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800" alt="그린 샐러드" style="width: 100%; border-radius: 12px; margin-bottom: 24px;">

        <h1 style="font-size: 24px; font-weight: 400; margin-bottom: 8px;">그린 샐러드 밀키트</h1>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">신선한 채소와 특제 드레싱이 함께 제공됩니다</p>

        <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px;">
          <span style="font-size: 28px; font-weight: 600;">8,900원</span>
        </div>

        <div style="display: flex; gap: 12px;">
          <button style="flex: 1; padding: 16px; background: #fff; border: 1px solid #000; font-size: 15px; cursor: pointer;">장바구니</button>
          <button style="flex: 2; padding: 16px; background: #000; color: #fff; border: none; font-size: 15px; cursor: pointer;">바로 구매</button>
        </div>
      </div>
    </section>

    <section style="padding: 40px 20px; background: #FDFBF7;">
      <div style="max-width: 800px; margin: 0 auto;">
        <h2 style="font-size: 18px; font-weight: 500; margin-bottom: 20px;">상품 설명</h2>
        <p style="font-size: 14px; color: #666; line-height: 1.8;">
          매일 아침 수확한 신선한 채소로 만든 샐러드 밀키트입니다.
          슬런치 팩토리만의 특제 비건 드레싱이 함께 제공되어
          누구나 쉽게 맛있는 샐러드를 즐길 수 있습니다.
        </p>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="footer-container"><div class="footer-logo">SLUNCH FACTORY</div><div class="footer-copyright"><p>&copy; 2024 Slunch Factory.</p></div></div></footer>
