<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 레시피 목록" />
    <title>Recipe List - 슬런치 팩토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <style>
      :root { --lime: #DCFD4A; --charcoal: #333; --warm-gray: #888; --muted: #999; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #FFFDF5; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      .header { height: 64px; background: var(--lime); border-bottom: 1px solid #000; position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
      .header-logo { height: 36px; }
      .header-back { position: absolute; left: 16px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #000; }

      main { margin-top: 64px; padding: 24px 16px; max-width: 800px; margin-left: auto; margin-right: auto; }

      .page-title { font-size: 24px; font-weight: 400; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #000; }

      .list-item { display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid #eee; text-decoration: none; color: inherit; }
      .list-item:hover { background: #f9f9f9; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
      .list-img { width: 120px; height: 90px; background: #E8E4DF; border-radius: 4px; flex-shrink: 0; overflow: hidden; }
      .list-img img { width: 100%; height: 100%; object-fit: cover; }
      .list-info { flex: 1; }
      .list-title { font-size: 16px; font-weight: 400; margin-bottom: 8px; }
      .list-meta { font-size: 13px; color: var(--warm-gray); }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="recipe.html" class="header-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <a href="index.html">
        <img src="../public/common/logo.png" alt="SLUNCH FACTORY" class="header-logo">
      </a>
    </header>

    <main>
      <h1 class="page-title">레시피 목록</h1>

      <a href="recipe-detail.html?id=1" class="list-item">
        <div class="list-img"><img src="../public/images/recipe/recipe-1.jpg" alt="비건 김치찌개" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-title">비건 김치찌개</h3>
          <p class="list-meta">30분 | 쉬움 | 한식</p>
        </div>
      </a>

      <a href="recipe-detail.html?id=2" class="list-item">
        <div class="list-img"><img src="../public/images/recipe/recipe-2.jpg" alt="두부 스테이크" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-title">두부 스테이크</h3>
          <p class="list-meta">40분 | 보통 | 양식</p>
        </div>
      </a>

      <a href="recipe-detail.html?id=3" class="list-item">
        <div class="list-img"><img src="../public/images/recipe/recipe-3.jpg" alt="버섯 리조또" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-title">버섯 리조또</h3>
          <p class="list-meta">45분 | 보통 | 양식</p>
        </div>
      </a>

      <a href="recipe-detail.html?id=4" class="list-item">
        <div class="list-img"><img src="../public/images/recipe/recipe-4.jpg" alt="아보카도 토스트" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-title">아보카도 토스트</h3>
          <p class="list-meta">15분 | 쉬움 | 브런치</p>
        </div>
      </a>
    </main>
  </body>
</html>
