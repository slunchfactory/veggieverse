<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spirit Finder - Reason | 슬런치 팩토리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="spirit-question.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="spirit-question-pattern.html" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 100%;"></div>
      </div>
      <a href="index.html" class="close-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>
  </header>

  <main class="question-main">
    <div class="question-container">
      <span class="question-step">7 / 7</span>
      <h1 class="question-title">비건에 관심을 갖게 된 이유는?</h1>

      <div class="options-grid">
        <a href="spirit-result.html" class="option-card">
          <span class="option-emoji">🌍</span>
          <span class="option-text">환경을 위해서</span>
        </a>
        <a href="spirit-result.html" class="option-card">
          <span class="option-emoji">💪</span>
          <span class="option-text">건강을 위해서</span>
        </a>
        <a href="spirit-result.html" class="option-card">
          <span class="option-emoji">🐰</span>
          <span class="option-text">동물을 위해서</span>
        </a>
        <a href="spirit-result.html" class="option-card">
          <span class="option-emoji">✨</span>
          <span class="option-text">그냥 호기심에</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
