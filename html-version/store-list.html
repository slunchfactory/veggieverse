<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 상품 목록" />
    <title>Store List - 슬런치 팩토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <style>
      :root { --lime: #DCFD4A; --charcoal: #333; --warm-gray: #888; --muted: #999; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #FFFDF5; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      .header { height: 64px; background: var(--lime); border-bottom: 1px solid #000; position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
      .header-logo { height: 36px; }
      .header-back { position: absolute; left: 16px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #000; }

      main { margin-top: 64px; padding: 24px 16px; max-width: 1200px; margin-left: auto; margin-right: auto; }

      .page-title { font-size: 24px; font-weight: 400; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #000; }

      .list-item { display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid #eee; text-decoration: none; color: inherit; }
      .list-item:hover { background: #f9f9f9; }
      .list-img { width: 100px; height: 100px; background: #F5F5F5; border-radius: 4px; flex-shrink: 0; overflow: hidden; }
      .list-img img { width: 100%; height: 100%; object-fit: cover; }
      .list-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
      .list-name { font-size: 16px; font-weight: 400; margin-bottom: 8px; }
      .list-desc { font-size: 14px; color: var(--warm-gray); margin-bottom: 8px; }
      .list-price { font-size: 15px; font-weight: 500; }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="store.html" class="header-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <a href="index.html">
        <img src="../public/common/logo.png" alt="SLUNCH FACTORY" class="header-logo">
      </a>
    </header>

    <main>
      <h1 class="page-title">상품 목록</h1>

      <a href="store-detail.html?id=1" class="list-item">
        <div class="list-img"><img src="../public/images/store/product-1.jpg" alt="볶음김치" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-name">볶음김치</h3>
          <p class="list-desc">젓갈이 들어가지 않은 비건 볶음김치</p>
          <span class="list-price">12,000원</span>
        </div>
      </a>

      <a href="store-detail.html?id=2" class="list-item">
        <div class="list-img"><img src="../public/images/store/product-2.jpg" alt="김치볶음밥" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-name">김치볶음밥</h3>
          <p class="list-desc">젓갈이 들어가지 않은 비건 캔김치로 구성한 김치볶음밥 밀키트</p>
          <span class="list-price">12,000원</span>
        </div>
      </a>

      <a href="store-detail.html?id=3" class="list-item">
        <div class="list-img"><img src="../public/images/store/product-3.jpg" alt="시금치 뇨끼" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-name">시금치 뇨끼</h3>
          <p class="list-desc">계란, 우유, 버터를 넣지 않은 비건 뇨끼</p>
          <span class="list-price">18,000원</span>
        </div>
      </a>

      <a href="store-detail.html?id=4" class="list-item">
        <div class="list-img"><img src="../public/images/store/product-4.jpg" alt="블루베리 타르트" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-name">블루베리 타르트</h3>
          <p class="list-desc">슬런치 팩토리 프리미엄 블루베리 타르트</p>
          <span class="list-price">39,000원</span>
        </div>
      </a>

      <a href="store-detail.html?id=5" class="list-item">
        <div class="list-img"><img src="../public/images/store/product-5.jpg" alt="복숭아 타르트" onerror="this.style.display='none'"></div>
        <div class="list-info">
          <h3 class="list-name">복숭아 타르트</h3>
          <p class="list-desc">달콤한 복숭아를 올린 비건 디저트</p>
          <span class="list-price">32,000원</span>
        </div>
      </a>
    </main>
  </body>
</html>
