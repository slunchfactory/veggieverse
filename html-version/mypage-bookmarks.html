<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리 - 북마크" />
    <title>My Bookmarks - 슬런치 팩토리</title>
    <link rel="icon" type="image/png" href="../public/common/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
    <style>
      /* === DESIGN SYSTEM === */
      :root {
        --header-h: 64px;
        --cream: #FDFBF7;
        --lime: #DCFD4A;
        --black: #000000;
        --gray: #6B6B6B;
        --gray-light: #9A9A9A;
        --charcoal: #333;
        --warm-gray: #888;
        --muted: #999;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; font-weight: 400 !important; }
      body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--cream);
        min-height: 100vh;
        color: var(--black);
      }

      /* === HEADER === */
      .header {
        height: var(--header-h);
        background: var(--lime);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 16px;
        max-width: 1440px;
        margin: 0 auto;
        position: relative;
      }
      .header-left button, .header-left a {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        color: var(--black);
      }
      .header-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .header-center img { height: 36px; display: block; }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-right a {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 14px;
        color: var(--black);
        text-decoration: none;
      }
      .header-profile {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #E5E5E5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* === MAIN CONTENT === */
      main {
        margin-top: var(--header-h);
        padding: 24px 16px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }

      .page-title {
        font-size: 24px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #000;
      }

      .tabs {
        display: flex;
        gap: 0;
        margin-bottom: 24px;
        border-bottom: 1px solid #eee;
      }
      .tab {
        padding: 12px 20px;
        font-size: 14px;
        color: var(--warm-gray);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        background: none;
        border-left: none;
        border-right: none;
        border-top: none;
      }
      .tab.active {
        color: #000;
        border-bottom-color: #000;
      }
      .tab:hover { color: #000; }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
      }
      .empty-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .empty-text {
        font-size: 15px;
        color: var(--warm-gray);
        margin-bottom: 24px;
      }
      .empty-btn {
        display: inline-block;
        padding: 12px 24px;
        background: #000;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
      .empty-btn:hover { background: #333; }

      .bookmark-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      @media (min-width: 640px) { .bookmark-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1024px) { .bookmark-grid { grid-template-columns: repeat(4, 1fr); } }

      .bookmark-card { position: relative; }
      .bookmark-img {
        aspect-ratio: 1;
        background: #E8E4DF;
        border-radius: 4px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .bookmark-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bookmark-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        background: rgba(255,255,255,0.9);
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bookmark-remove:hover { background: #fff; }
      .bookmark-name {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .bookmark-price {
        font-size: 14px;
        color: var(--warm-gray);
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a href="mypage.html" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
        </div>
        <a href="index.html" class="header-center">
          <img src="../public/common/logo.png" alt="SLUNCH FACTORY">
        </a>
        <div class="header-right">
          <a href="cart.html" aria-label="장바구니">(0)</a>
          <a href="mypage.html" aria-label="마이페이지">
            <div class="header-profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </a>
        </div>
      </div>
    </header>

    <main>
      <h1 class="page-title">북마크</h1>

      <div class="tabs">
        <button class="tab active">상품</button>
        <button class="tab">레시피</button>
      </div>

      <!-- Empty State -->
      <div class="empty-state">
        <div class="empty-icon">🔖</div>
        <p class="empty-text">아직 북마크한 항목이 없습니다.</p>
        <a href="store.html" class="empty-btn">상품 둘러보기</a>
      </div>

      <!-- Bookmark Grid Example (hidden by default) -->

        <div class="bookmark-card">
          <div class="bookmark-img">
            <img src="../public/images/store/product-1.jpg" alt="볶음김치">
            <button class="bookmark-remove">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <p class="bookmark-name">볶음김치</p>
          <p class="bookmark-price">12,000원</p>
        </div>
      </div>
      -->
    </main>
  </body>
</html>
