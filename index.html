<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="슬런치 팩토리의 비건 푸드 플랫폼. 건강한 식단, 레시피, 뉴스레터를 만나보세요." />
    <meta name="keywords" content="비건, 채식, 슬런치, 레시피, 건강식단" />
    <meta property="og:title" content="VeggieVerse - 슬런치 팩토리" />
    <meta property="og:description" content="슬런치 팩토리의 비건 푸드 플랫폼" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slunch.co.kr/veggieverse" />
    <meta property="og:image" content="./common/logo.png" />
    <link rel="icon" type="image/png" href="./common/logo.png" />
    <!-- Retro Pixel Font for Recipe Finder -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <title>VeggieVerse - 슬런치 팩토리</title>
    <!-- GitHub Pages SPA 라우팅: 404.html에서 리다이렉트된 경로를 복원 -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- 스타일: index.tsx에서 import (Vite base=/veggieverse/ 와 일치) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
